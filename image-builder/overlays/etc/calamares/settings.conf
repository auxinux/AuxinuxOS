# Configuration Calamares — AuxiNux OS EN 0.1-BETA
# Installation classique sur disque (UEFI amd64), non immuable.
#
# IMPORTANT (audit securite): la sequence "exec" se termine par
# shellprocess@cleanup qui retire les artefacts du live (sudo NOPASSWD,
# compte par defaut "auxinux", autologin). NE PAS retirer ce job avant ISO
# publique. A valider en VM avant diffusion.

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
# Active temporairement APT direct dans la cible pour que bootloader-config
# puisse installer/configurer GRUB (apt y est sinon redirige vers auxi).
- id:     enableapt
  module: shellprocess
  config: shellprocess-enableapt.conf
# Configure le rollback systeme (snapper + grub-btrfs) sur la cible BTRFS.
# Non bloquant: sort en code 0 si la racine n'est pas BTRFS.
- id:     snapshots
  module: shellprocess
  config: shellprocess-snapshots.conf
# Relit le noyau et l'initrd DEPUIS LE DISQUE, cache vide, comme le fera GRUB.
# Seul job de la sequence autorise a faire echouer l'installation.
- id:     verifyboot
  module: shellprocess
  config: shellprocess-verifyboot.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@enableapt
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  # sources-final VOLONTAIREMENT retire: il ecrirait les depots generiques
  # deb.debian.org. AuxiNux OS utilise son miroir complet dep.auxinux.ca
  # (main/contrib/non-free + updates + security), deja present dans
  # sources.list.d. On garde donc uniquement les depots AuxiNux + Brave.
  - shellprocess@cleanup
  # DOIT rester apres cleanup: celui-ci purge live-boot et regenere
  # l'initramfs, et snapshots termine par update-grub. Genere plus tot, le
  # sous-menu de restauration pointerait sur un initrd contamine par
  # live-boot.
  - shellprocess@snapshots
  # DERNIER controle avant le demontage: une installation qui s'annonce
  # reussie mais dont le noyau est illisible produit, au redemarrage,
  # « error: premature end of file /@/boot/vmlinuz-... ». Autant le dire
  # pendant que l'utilisateur est encore devant l'ecran.
  - shellprocess@verifyboot
  - umount
- show:
  - finished

branding: auxinuxos

prompt-install: true

dont-chroot: false

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
