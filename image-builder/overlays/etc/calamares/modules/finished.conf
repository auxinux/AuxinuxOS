# Module "finished" — override AuxiNuxOS EN.
#
# La config stock de calamares-settings-debian utilise
#   restartNowCommand: "systemctl -i reboot"
# c.-a-d. un arret systemd PROPRE. Sur une session LIVE (live-boot +
# squashfs/overlay), cette sequence se bloque au demontage du media live:
# cosmic-comp est tue (l'ecran retombe sur une console texte) puis l'arret
# gele -> exactement le symptome rapporte ("sortie instantanee de
# l'interface, console figee, rien a faire").
#
# On force donc un redemarrage IMMEDIAT (`systemctl reboot -ff`), qui saute
# le demontage/teardown. C'est sans risque ici: le module `umount` de la
# sequence a deja demonte et synchronise le disque CIBLE avant la page
# "finished", donc seul le systeme live jetable est court-circuite.
---
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "systemctl reboot -ff"
