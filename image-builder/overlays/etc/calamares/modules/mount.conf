# Module "mount" — options de montage PENDANT l'installation.
#
# ATTENTION: des qu'on fournit ce fichier, Calamares n'utilise plus ses
# defauts compiles. La liste `extraMounts` doit donc etre COMPLETE, sinon la
# cible n'a ni /proc ni /sys ni /dev et tous les modules chrootes qui suivent
# (bootloader, initramfs, shellprocess...) echouent.
#
# compress=zstd:1 n'est pas seulement un gain d'espace: il REDUIT le volume
# d'E/S disque, donc ameliore la reactivite sur SSD comme sur disque mecanique.
# Le niveau 1 est choisi pour ne pas facturer de CPU perceptible.
#
# Les options ecrites dans le /etc/fstab du systeme installe sont definies
# separement dans fstab.conf — les deux fichiers doivent rester coherents.
---
extraMounts:
    - device: proc
      fs:     proc
      mountPoint: /proc
    - device: sys
      fs:     sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: bind
    - device: tmpfs
      fs:     tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: bind

extraMountsEfi:
    - device: efivarfs
      fs:     efivarfs
      mountPoint: /sys/firmware/efi/efivars

mountOptions:
    - filesystem: default
      options: [ "defaults" ]
    - filesystem: btrfs
      options:    [ "defaults", "noatime", "compress=zstd:1", "space_cache=v2" ]
      ssdOptions: [ "ssd", "discard=async" ]
    - filesystem: ext4
      options:    [ "defaults", "noatime" ]
      ssdOptions: [ "discard" ]
