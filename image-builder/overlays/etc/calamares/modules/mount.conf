# Module "mount" — options de montage PENDANT l'installation.
#
# ATTENTION: des qu'on fournit ce fichier, Calamares n'utilise plus ses
# defauts compiles. La liste `extraMounts` doit donc etre COMPLETE, sinon la
# cible n'a ni /proc ni /sys ni /dev et tous les modules chrootes qui suivent
# (bootloader, initramfs, shellprocess...) echouent.
#
# `options` DOIT etre une LISTE, jamais une chaine.
#
#   options: bind        <- PIEGE: main.py fait ",".join(options). Sur une
#                           chaine, Python joint les CARACTERES et produit
#                           "b,i,n,d". Calamares lance alors
#                           `mount -o b,i,n,d /dev <cible>/dev`, qui echoue
#                           (code 32). Le module se contente d'un
#                           warning("Cannot mount /dev") et l'installation
#                           CONTINUE sans /dev: plus aucun noeud de disque
#                           dans le chroot, et grub-probe echoue avec
#                           "failed to get canonical path of `/dev/vda1'".
#   options: [ bind ]    <- correct.
#
# /dev/pts doit etre monte EXPLICITEMENT: `bind` n'est pas recursif et ne
# transporte pas les montages imbriques dans /dev. Sans lui, apt et dpkg
# echouent sur "Can not write log (Is /dev/pts mounted?)".
#
# Les entrees reservees a l'UEFI se marquent `efi: true`. La cle
# `extraMountsEfi` n'existe PAS dans ce module (verifie dans main.py): elle
# etait silencieusement ignoree, donc efivarfs n'etait jamais monte et
# grub-install ne pouvait pas enregistrer l'entree de demarrage NVRAM.
#
# L'ordre de montage est calcule par Calamares, qui trie sur `mountPoint`.
# Le tri alphabetique garantit qu'un parent passe avant ses enfants
# (/dev avant /dev/pts, /sys avant /sys/firmware/efi/efivars).
#
# compress=zstd:1 n'est pas seulement un gain d'espace: il REDUIT le volume
# d'E/S disque, donc ameliore la reactivite sur SSD comme sur disque mecanique.
# Le niveau 1 est choisi pour ne pas facturer de CPU perceptible.
#
# Les options ecrites dans le /etc/fstab du systeme installe sont definies
# separement dans fstab.conf — les deux fichiers doivent rester coherents.
#
# SOUS-VOLUMES BTRFS: c'est CE module qui les cree, pas `partition`.
#
#   La liste vivait dans partition.conf, ou Calamares ne la lit pas (ni le
#   module C++ `partition`, ni son schema ne connaissent la cle). Elle etait
#   donc ignoree en silence; seul le journal de Calamares le disait:
#     WARNING: [PYTHON JOB]: "No configuration for btrfsSubvolumes"
#   et le module appliquait son defaut, @ et @home. Constate en VM le
#   2026-09-29 sur l'ISO publiee: AUCUN systeme installe n'avait @snapshots,
#   donc snapper ne pouvait creer aucun instantane et le rollback -- fonction
#   phare -- n'existait sur aucune machine.
#
#   /swap n'est PAS dans la liste, et ne doit pas y etre: quand l'utilisateur
#   choisit un fichier d'echange, main.py AJOUTE lui-meme btrfsSwapSubvol a la
#   liste. L'y ecrire en plus ferait creer @swap deux fois; le second
#   `btrfs subvolume create` echoue (check_call) et l'installation s'arrete.
#
#   Ce qui est hors de "@" n'est pas capture par les instantanes, donc n'est
#   pas efface par un rollback:
#   @home            donnees utilisateur: un rollback systeme ne doit JAMAIS
#                    detruire les fichiers de l'utilisateur.
#   @snapshots       DOIT etre un sous-volume de premier niveau, pas imbrique
#                    dans @: `auxi rollback` renomme @ pour le remplacer, et
#                    l'historique partirait avec lui au moment precis ou
#                    l'utilisateur en a besoin.
#   @var_log         les journaux survivent au rollback: on garde la trace de
#                    la panne qu'on vient d'annuler.
#   @var_cache       cache APT, aucun interet a l'archiver.
#   @var_tmp         transitoire.
#   @var_lib_flatpak les applications Flatpak sont du contenu utilisateur, pas
#                    de l'etat systeme: elles ne gonflent pas les instantanes
#                    et ne disparaissent pas lors d'un rollback.
---
btrfsSubvolumes:
    - mountPoint: /
      subvolume:  /@
    - mountPoint: /home
      subvolume:  /@home
    - mountPoint: /.snapshots
      subvolume:  /@snapshots
    - mountPoint: /var/log
      subvolume:  /@var_log
    - mountPoint: /var/cache
      subvolume:  /@var_cache
    - mountPoint: /var/tmp
      subvolume:  /@var_tmp
    - mountPoint: /var/lib/flatpak
      subvolume:  /@var_lib_flatpak

# Sous-volume du fichier d'echange (sans copy-on-write ni compression, que
# le module fstab pose avec `chattr +C +m`). Ajoute automatiquement a la
# liste ci-dessus quand l'utilisateur choisit « Swap dans un fichier ».
btrfsSwapSubvol: /@swap

extraMounts:
    - device: proc
      fs:     proc
      mountPoint: /proc
    - device: sys
      fs:     sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: devpts
      fs:     devpts
      mountPoint: /dev/pts
    - device: tmpfs
      fs:     tmpfs
      mountPoint: /dev/shm
    - device: tmpfs
      fs:     tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs:     efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi:    true

mountOptions:
    - filesystem: default
      options: [ "defaults" ]
    - filesystem: btrfs
      options:    [ "defaults", "noatime", "compress=zstd:1", "space_cache=v2" ]
      ssdOptions: [ "ssd", "discard=async" ]
    - filesystem: ext4
      options:    [ "defaults", "noatime" ]
      ssdOptions: [ "discard" ]
