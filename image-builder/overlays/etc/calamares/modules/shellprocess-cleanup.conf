# Module shellprocess — nettoyage post-installation (audit securite).
#
# S'execute chroote dans le systeme installe (dontChroot: false), donc
# TARGET_ROOT vaut "/". Le script retire les artefacts du live: icone
# d'installation, sudoers NOPASSWD, autologin SDDM, override de verrouillage
# d'ecran et compte par defaut "auxinux".
#
# NOTE: l'installateur ne doit PAS autoriser l'utilisateur a nommer son compte
# "auxinux", sous peine de voir ce compte supprime par ce job. A defaut,
# definir AUXINUX_KEEP_USER avant l'execution.

dontChroot: false
# 900 s et non 120: ce job purge live-boot ET Calamares, puis regenere TOUS les
# initramfs. Sur un disque mecanique, 120 s etaient depasses et l'installation
# echouait en toute fin de sequence, apres la copie du systeme.
timeout: 900

script:
  - "/usr/lib/auxinux/post-install-cleanup.sh /"
