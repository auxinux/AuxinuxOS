# Module "fstab" — options ecrites dans le /etc/fstab du systeme INSTALLE.
#
# Distinct de mount.conf, qui ne concerne que la duree de l'installation. Sans
# ce fichier, Calamares ecrit `defaults` et le systeme installe perd la
# compression zstd et noatime: le rollback fonctionnerait toujours, mais on
# perdrait le gain de fluidite (moins d'E/S) et les instantanes occuperaient
# nettement plus de place.
#
# discard=async remplace fstrim.timer sur BTRFS: le TRIM est regroupe et
# emis en arriere-plan, sans la pause perceptible du TRIM synchrone.
---
mountOptions:
    default: "defaults,noatime"
    btrfs:   "defaults,noatime,compress=zstd:1,space_cache=v2"

ssdExtraMountOptions:
    btrfs: "discard=async"
    ext4:  "discard"
    xfs:   "discard"
    swap:  "discard"

crypttabOptions: "luks"
