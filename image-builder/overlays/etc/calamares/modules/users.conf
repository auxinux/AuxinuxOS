---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1

user:
    shell: /bin/bash
    forbidden_names: [ root, nobody, auxinux ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    forbidden_names: [ localhost, auxinuxos-live ]
