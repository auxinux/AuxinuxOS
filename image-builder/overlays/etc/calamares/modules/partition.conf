# Module "partition" — AuxiNux OS.
#
# Sans ce fichier, Calamares utilise ses defauts compiles (ext4) et le
# rollback systeme devient impossible. On force donc BTRFS comme systeme de
# fichiers par defaut.
#
# LES SOUS-VOLUMES NE SE DECLARENT PAS ICI. Ce module ne lit ni
# `btrfsSubvolumes` ni `btrfsSwapSubvol`: c'est le module `mount` qui les cree
# (voir mount.conf). Les deux cles ont vecu dans ce fichier jusqu'au
# 2026-09-29, ignorees en silence -- aucun systeme installe n'avait @snapshots,
# donc aucun instantane n'etait possible.
#
# A VALIDER EN VM avant toute ISO publique: BTRFS + LUKS + grub-btrfs (voir
# docs/limitations.md).
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: "512MiB"
efiSystemPartitionName: EFI

userSwapChoices:
    - none
    - file
    - suspend

initialPartitioningChoice: erase
initialSwapChoice:         file

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
allowManualPartitioning:   true

defaultFileSystemType:    "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

luksGeneration: "luks2"

