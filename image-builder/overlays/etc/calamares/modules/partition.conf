# Module "partition" — AuxiNux OS EN.
#
# Sans ce fichier, Calamares utilise ses defauts compiles (ext4, aucun
# sous-volume) et le rollback systeme devient impossible. On force donc BTRFS
# comme systeme de fichiers par defaut, avec une disposition de sous-volumes
# plate ("@") compatible avec snapper et grub-btrfs.
#
# Choix des sous-volumes — ce qui est HORS de "@" n'est pas capture par les
# instantanes, donc n'est pas efface par un rollback:
#   @home            : donnees utilisateur. Un rollback systeme ne doit JAMAIS
#                      detruire les fichiers de l'utilisateur.
#   @snapshots       : doit etre un sous-volume DE PREMIER NIVEAU, pas un
#                      sous-volume imbrique dans @. Sinon "auxi rollback"
#                      deplace @ avec tout son historique et l'utilisateur
#                      perd ses instantanes au moment precis ou il en a besoin.
#   @var_log         : les journaux doivent SURVIVRE au rollback, sinon on
#                      perd la trace de la panne qu'on vient d'annuler.
#   @var_cache       : cache APT, aucun interet a l'archiver.
#   @var_tmp         : transitoire.
#   @var_lib_flatpak : AuxiNuxOS met Flatpak en avant. Les applications
#                      Flatpak sont du contenu utilisateur, pas de l'etat
#                      systeme: elles ne doivent pas gonfler les instantanes
#                      ni disparaitre lors d'un rollback. Elles sont de toute
#                      facon isolees et ne peuvent pas casser le demarrage.
#
# A VALIDER EN VM avant toute ISO publique: BTRFS + LUKS + grub-btrfs, et le
# fichier d'echange sur @swap (voir docs/limitations.md).
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: "512MiB"
efiSystemPartitionName: EFI

userSwapChoices:
    - none
    - file
    - suspend

initialPartitioningChoice: erase
initialSwapChoice:         file

# Un fichier d'echange sur BTRFS exige un sous-volume dedie, sans
# copy-on-write ni compression. Calamares s'en charge via cette cle.
btrfsSwapSubvol: "/@swap"

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
allowManualPartitioning:   true

defaultFileSystemType:    "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

luksGeneration: "luks2"

btrfsSubvolumes:
    - mountPoint: "/"
      subvolume:  "/@"
    - mountPoint: "/home"
      subvolume:  "/@home"
    - mountPoint: "/.snapshots"
      subvolume:  "/@snapshots"
    - mountPoint: "/var/log"
      subvolume:  "/@var_log"
    - mountPoint: "/var/cache"
      subvolume:  "/@var_cache"
    - mountPoint: "/var/tmp"
      subvolume:  "/@var_tmp"
    - mountPoint: "/var/lib/flatpak"
      subvolume:  "/@var_lib_flatpak"
