# Module "locale" — AuxiNux OS.
#
# Sans ce fichier, Calamares part de son defaut compile, America/New_York.
# Constate en VM le 2026-09-29 avec l'ISO publiee: une installation en
# francais proposait alors
#   « La langue du systeme sera reglee sur francais (France) »
#   « Les nombres et les dates seront regles sur American English »
# et, PLUS GRAVE, le module clavier deduisait de fr_FR une disposition
# « French » -- l'AZERTY de France -- pour des utilisateurs dont le clavier est
# un QWERTY canadien. Calamares l'applique aussitot: le nom et le mot de passe
# tapes a la page suivante ne sont plus ceux que l'utilisateur croit taper.
#
# Toronto et non Montreal: c'est la zone de reference de l'Est canadien dans
# la base des fuseaux (America/Montreal n'en est qu'un alias). Le pays CA de
# cette zone donne fr_CA.UTF-8 (ou en_CA.UTF-8 en anglais), et le module clavier
# deduit de « CA » la disposition « French (Canada) » -- le QWERTY du Quebec,
# identique au clavier americain pour les lettres et les chiffres.
#
# Pas de `geoip`: aucune requete vers un service de geolocalisation tiers
# pendant l'installation (voir docs/privacy-stance.md).
---
region: "America"
zone:   "Toronto"

# Liste des langues proposees: celles de /etc/locale.gen (fr_CA, fr_FR,
# en_CA, en_US). locales-all fournit de toute facon toutes les locales
# compilees.
localeGenPath: "/etc/locale.gen"
