# Module shellprocess — configuration du rollback systeme (BTRFS + snapper).
#
# S'execute chroote dans le systeme installe (dontChroot: false), donc
# TARGET_ROOT vaut "/".
#
# DOIT rester le DERNIER job de la sequence exec, apres shellprocess@cleanup:
# le nettoyage purge live-boot puis regenere l'initramfs, et ce script termine
# par update-grub. Inverser l'ordre produirait un menu GRUB genere avant la
# purge, dont les entrees d'instantanes pointeraient sur un initrd contamine
# par les hooks live-boot (panne "l'ecran change mais ne charge jamais").
#
# Sortie non bloquante par conception: une racine ext4 ou un snapper absent
# fait sortir le script en code 0 sans configurer le rollback.

dontChroot: false
# snapper (quotas, instantane initial) puis update-grub, qui parcourt aussi
# les instantanes (grub-btrfs) et les autres systemes (os-prober). Large, pour
# les disques mecaniques: un depassement ferait echouer l'installation.
timeout: 900

script:
  - "/usr/lib/auxinux/setup-btrfs-rollback.sh /"
