# Active l'acces direct a APT dans le systeme cible (APT_ENABLED=1) afin que le
# module bootloader-config puisse installer/configurer GRUB. Sans cela, apt-get
# dans la cible est redirige vers le wrapper auxi et l'installation de GRUB
# echoue (exit 127). post-install-cleanup.sh restaure APT_ENABLED=0 a la fin.
---
dontChroot: false
timeout: 60
script:
  - "mkdir -p /etc/auxinux"
  - "/bin/sh -c 'echo APT_ENABLED=1 > /etc/auxinux/apt.conf'"
