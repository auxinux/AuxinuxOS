# Module "keyboard" — AuxiNux OS.
#
# La disposition par defaut est DEDUITE de la langue du systeme (guessLayout):
# fr_CA et en_CA donnent « French (Canada) », grace a la zone par defaut posee
# dans locale.conf. Tant que la zone restait celle de New York, la deduction
# donnait l'AZERTY de France.
#
# Calamares applique la disposition choisie a sa propre fenetre (setxkbmap sur
# Xwayland): le mot de passe est donc tape dans la disposition qui sera celle
# du systeme installe. L'ecran de connexion (X11) la lit dans
# /etc/X11/xorg.conf.d/00-keyboard.conf; la session Plasma (KWin/Wayland) dans
# /etc/xdg/kxkbrc, que post-install-cleanup.sh ecrit a partir de
# /etc/default/keyboard. Les trois doivent concorder: sinon le mot de passe ne
# deverrouille plus l'ecran.
#
# L'apercu du clavier exige `ckbcomp` (paquet console-setup, dans base.txt).
---
writeEtcDefaultKeyboard: true
guessLayout: true
