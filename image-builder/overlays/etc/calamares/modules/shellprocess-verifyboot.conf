# Module shellprocess — verification finale d'amorcabilite.
#
# DOIT etre le DERNIER job de la sequence exec, juste avant `umount`: tout ce
# qui ecrit sur la cible doit avoir eu lieu (unpackfs, bootloader, initramfs,
# cleanup, snapshots) pour que la relecture ait un sens.
#
# Contrairement aux autres jobs maison, celui-ci ECHOUE volontairement quand le
# systeme installe ne demarrerait pas. Une installation qui s'annonce reussie
# et produit une machine morte au redemarrage coute infiniment plus cher a
# l'utilisateur qu'une erreur affichee pendant qu'il est encore devant
# l'installateur.

dontChroot: false
# 600 s: `sync` doit d'abord vider sur le disque tout ce que les jobs
# precedents ont ecrit, puis la relecture du noyau et de l'initrd, cache vide,
# passe par le disque reel. Sur un disque mecanique lent, cela se compte en
# minutes.
timeout: 600

script:
  - "/usr/lib/auxinux/verify-installed-boot.sh /"
