# Module "grubcfg" — override AuxiNuxOS.
#
# Sans ce fichier, le module utilise ses defauts compiles et peut reecrire
# /etc/default/grub en perdant nos parametres noyau. On force donc l'ecriture
# de /etc/default/grub a partir de la table `defaults` ci-dessous, qui inclut
# `pci=noaer pcie_aspm=off` (GRUB_CMDLINE_LINUX) pour eviter la tempete
# d'erreurs PCIe AER des cartes WiFi Atheros/ath10k qui bloque le demarrage
# du systeme installe. `bootloader`/grub-mkconfig s'appuie ensuite dessus.
---
overwrite: true
keepDistributor: false
prependToKernelParams: false
appendToKernelParams: false

defaults:
  GRUB_DEFAULT: "0"
  GRUB_TIMEOUT: "5"
  GRUB_DISTRIBUTOR: "AuxiNux OS"
  # Vide, et non "quiet splash": ce module ECRASE /etc/default/grub sur la
  # cible (overwrite: true). Y laisser `quiet` reintroduisait, sur le systeme
  # installe, le demarrage muet qui rendait toute panne de session
  # indiscernable d'un blocage. `splash` etait de toute facon sans effet,
  # plymouth n'etant pas installe.
  GRUB_CMDLINE_LINUX_DEFAULT: ""
  GRUB_CMDLINE_LINUX: "pci=noaer pcie_aspm=off"
  GRUB_TERMINAL_OUTPUT: "gfxterm"
