# Mode urgence REELLEMENT utilisable.
#
# Le compte root d'AuxiNuxOS est verrouille (Calamares: setRootPassword:
# false; l'administration passe par sudo). Quand un montage essentiel echoue,
# systemd ouvre le mode urgence, et sulogin repond alors:
#
#   Cannot open access to console, the root account is locked.
#
# puis tourne en rond: la machine s'arrete la, sur un ecran que l'utilisateur
# ne peut ni lire ni quitter. SYSTEMD_SULOGIN_FORCE=1 ouvre l'interpreteur
# root malgre le verrou.
#
# Ce n'est pas une ouverture nouvelle: ce shell n'existe que devant le clavier
# de la machine, et quiconque y est assis peut deja modifier une entree GRUB
# (aucun mot de passe GRUB) ou demarrer une cle USB. Avec LUKS, il n'apparait
# qu'une fois le disque deverrouille.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
