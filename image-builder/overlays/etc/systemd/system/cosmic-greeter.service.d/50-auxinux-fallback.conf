# Filet de securite du gestionnaire de connexion.
#
# PANNE REPRODUITE EN VM (2026-09-09), a l'origine des deux symptomes
# rapportes -- « ecran noir apres le choix de la langue » dans le live, et
# « le systeme installe ne finit jamais de demarrer »:
#
#   1. cosmic-greeter.service declare Conflicts=getty@tty1.service. En
#      demarrant, il ARRETE la console texte de tty1.
#   2. Il declare Restart=always avec StartLimitBurst=5 sur 30 s. Si le
#      greeter echoue (pilote graphique, session utilisateur, PAM...),
#      systemd renonce au bout de cinq essais: etat « failed
#      (start-limit-hit) ».
#   3. Plus rien ne reprend tty1: getty@tty1 reste INACTIVE. L'ecran est alors
#      noir a 100 %, definitivement, sans un seul message.
#
# Le systeme tourne pourtant (verifie: 14 services actifs, connexion possible
# par la console serie). L'utilisateur, lui, n'a aucun moyen de le savoir ni
# d'agir: il conclut que le demarrage ne se termine jamais.
#
# OnFailure rend la main a une console de connexion des que le greeter
# abandonne. On perd le bureau, mais on garde une machine utilisable et
# diagnosticable au lieu d'un ecran noir muet.
[Unit]
OnFailure=getty@tty1.service

# StartLimit* appartient a la section [Unit] depuis systemd 229; l'unite amont
# les place encore dans [Service], ou systemd les ignore avec un
# avertissement. On les redeclare au bon endroit pour que le nombre d'essais
# soit reellement celui qu'on croit.
StartLimitIntervalSec=30
StartLimitBurst=5

[Service]
# Deux secondes entre deux essais plutot qu'une: sur une machine lente ou une
# VM sans acceleration, une seconde ne laisse pas au compositeur le temps de
# rendre la main sur le peripherique DRM, et les cinq essais sont consommes
# avant meme que le materiel soit pret.
RestartSec=2
