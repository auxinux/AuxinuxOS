# Filet de securite de l'ecran de connexion.
#
# HERITE D'UNE PANNE REELLE (reproduite en VM le 2026-09-09 avec l'ancien
# couple greetd + cosmic-greeter): un gestionnaire d'affichage qui echoue en
# boucle, atteint sa limite de redemarrages et laisse un ecran 100 % NOIR, sans
# console, sans message. Le systeme tournait, l'utilisateur n'avait aucun moyen
# de le savoir.
#
# Deux garde-fous ici:
#   1. OnFailure: des que sddm abandonne, une console de connexion revient sur
#      tty1. On perd le bureau, on garde une machine utilisable.
#   2. ConditionPathExists inverse: si auxinux-boot-arm.service a constate deux
#      demarrages sans session graphique, sddm ne demarre PAS et laisse la
#      place a auxinux-rescue (restauration). Sans cette condition, on
#      relancerait indefiniment un bureau qui ne marche pas.
[Unit]
OnFailure=getty@tty1.service
ConditionPathExists=!/run/auxinux/rescue

# StartLimit* appartient a [Unit] depuis systemd 229. Declare dans [Service],
# systemd l'ignore avec un simple avertissement -- et le nombre d'essais n'est
# pas celui qu'on croit.
StartLimitIntervalSec=30
StartLimitBurst=5

[Service]
# Deux secondes entre deux essais: sur une VM sans acceleration, une seconde
# ne laisse pas au serveur graphique le temps de rendre la main sur le
# peripherique DRM, et les cinq essais sont consommes avant que le materiel
# soit pret.
RestartSec=2
