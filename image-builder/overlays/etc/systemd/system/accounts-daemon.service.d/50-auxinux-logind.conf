# accounts-daemon echouait a CHAQUE demarrage (verifie en VM):
#
#   accounts-daemon.service: Failed to set up mount namespacing:
#   /run/systemd/seats: No such file or directory
#   Failed at step NAMESPACE ... status=226/NAMESPACE
#
# L'unite amont demande a systemd de rendre /run/systemd/seats accessible dans
# son espace de noms, mais ce repertoire n'est cree que par systemd-logind a
# son propre demarrage. Sans ordre entre les deux, accounts-daemon gagne la
# course une fois sur deux et meurt.
#
# Consequence visible: l'ecran de connexion COSMIC n'a plus de service pour
# resoudre les noms complets et les avatars des comptes, et le systeme reste
# marque « degraded » en permanence.
[Unit]
After=systemd-logind.service
Wants=systemd-logind.service
