# systemd-oomd — evite le GEL TOTAL en cas de saturation memoire.
#
# Sans lui, une machine a court de memoire ne plante pas: elle devient
# inutilisable pendant plusieurs minutes, souris comprise, pendant que le
# noyau echange frenetiquement. L'utilisateur croit a un plantage et coupe
# l'alimentation -- avec le risque de corruption que cela implique.
# systemd-oomd tue l'application fautive avant d'en arriver la.
[OOM]
# Duree pendant laquelle la pression memoire doit rester au-dessus du seuil
# avant d'agir. Trop court, on tue une application pendant un pic normal
# (compilation, import de photos); 20 s distingue un pic d'une saturation.
DefaultMemoryPressureDurationSec=20s
