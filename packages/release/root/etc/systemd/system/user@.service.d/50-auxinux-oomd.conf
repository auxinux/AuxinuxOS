# Surveillance de la pression memoire sur la session utilisateur.
#
# systemd-oomd n'agit que sur les tranches (slices) qui l'autorisent
# explicitement: sans ce fichier, le service tourne mais ne fait RIEN.
#
# La cible est user@.service: systemd-oomd tue alors le descendant le plus
# gourmand (une application), pas la session entiere. Viser -.slice tuerait
# des services systeme et rendrait le remede pire que le mal.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
