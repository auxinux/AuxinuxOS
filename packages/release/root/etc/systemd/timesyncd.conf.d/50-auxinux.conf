# Serveurs d'heure d'AuxiNux OS (decision du 2026-10-05, docs/privacy-stance.md).
#
# Le Conseil national de recherches du Canada (CNRC) tient l'heure officielle
# du Canada: un organisme public canadien plutot que des benevoles inconnus,
# coherent avec la loi 25. Le pool Debian ne sert qu'en secours, si les
# serveurs du CNRC ne repondent pas.
#
# Sans heure juste, aucun certificat HTTPS ne se verifie: ni l'installateur, ni
# apt, ni Flatpak ne fonctionnent.
[Time]
NTP=time.nrc.ca time.chu.nrc.ca
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org
