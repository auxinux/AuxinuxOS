# AuxiNux OS 0.3.0: logo AuxiNux et roue orange au demarrage (Plymouth, theme
# auxinux) au lieu du texte de la console. Lu par grub-mkconfig APRES
# /etc/default/grub. Seule l'entree normale est concernee: « options avancees »
# (mode de secours) garde le texte. Echap pendant le demarrage montre le texte.
# loglevel=3 et rd.udev.log_level=3: aucune ligne du noyau ni d'udev sur le
# logo; systemd.show_status=auto: systemd n'ecrit qu'en cas d'echec.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0"
