# Ecran de connexion AuxiNuxOS.
#
# Le greeter tourne en X11 (defaut de Debian) et les sessions utilisateur en
# Wayland: c'est la combinaison testee par Debian et KDE. L'autologin du LIVE
# est dans un fichier separe (90-auxinux-live-autologin.conf), ecrit par
# build-image.sh et SUPPRIME du systeme installe par post-install-cleanup.sh.
[Theme]
# Theme AuxiNux (/usr/share/sddm/themes/auxinux, QtQuick seul): debian-breeze
# dependait de plasma-workspace, retire de l'image le 2026-10-23.
Current=auxinux

[General]
# Bureau par defaut: AuxiNux Shell (decision d'aporler, 2026-10-10). SDDM ne
# s'en sert que pour un compte sans session memorisee: une machine qui
# utilisait Plasma le garde. Le centre de controle (Reglages, « Bureau »)
# change ce choix pour tout le monde: 20-auxinux-session.conf, qui passe
# apres ce fichier.
DefaultSession=auxinux.desktop
# Rend la disposition du clavier coherente avec /etc/default/keyboard des le
# mot de passe: sans ca, un clavier fr-CA tape en qwerty us a l'ecran de
# connexion et l'utilisateur croit avoir oublie son mot de passe.
InputMethod=
Numlock=on

[Users]
# Le compte live a l'UID 60000 (voir build-image.sh): sans cette borne, il
# n'apparaitrait pas dans la liste des utilisateurs du greeter.
MaximumUid=60000
MinimumUid=1000
