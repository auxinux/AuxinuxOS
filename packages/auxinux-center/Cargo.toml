[package]
name = "auxinux-center"
version = "0.1.0"
edition = "2021"
description = "AuxiNux OS Center — magasin d'applications, gestion des sources et infos systeme"
license = "GPL-3.0-or-later"
repository = "https://auxinux.ca/"

[[bin]]
name = "auxinux-center"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

[build-dependencies]
cxx-qt-build = "0.7"
