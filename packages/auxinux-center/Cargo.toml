[package]
name = "auxinux-center"
version = "0.2.0"
edition = "2021"
description = "AuxiNux OS Center — centre de controle: applications, mises a jour, sante, sources, reglages, restauration"
license = "GPL-3.0-or-later"
repository = "https://auxinux.ca/"

[[bin]]
name = "auxinux-center"
path = "src/main.rs"

[[bin]]
name = "auxinux-installer"
path = "src/installer/main.rs"
required-features = ["tui"]

[features]
# L'interface est optionnelle POUR POUVOIR VALIDER LE BACKEND partout:
#   cargo check --no-default-features   # logique seule, aucune dependance systeme
#   cargo build --release               # application complete (hote de build)
# libcosmic exige libxkbcommon, wayland et une pile graphique que les machines
# de developpement n'ont pas toujours; sans cette separation, la moindre
# verification du backend devient impossible hors de l'hote de build.
default = ["gui"]
gui = ["dep:libcosmic", "dep:tokio", "dep:open"]
# Installateur console « Install NOW » (auxinux-installer). Separe de "gui":
# il tourne sur la console du live, sans pile graphique, et ne doit pas tirer
# libcosmic. `cargo build --release --no-default-features --features tui
# --bin auxinux-installer`.
tui = ["dep:ratatui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

# --- Interface (feature "gui") ---------------------------------------------
# libcosmic est le toolkit NATIF de COSMIC (base sur iced). Il remplace
# Kirigami/CXX-Qt: l'application adopte le theme du bureau, ne tire plus la
# pile KF6 dans l'ISO et demarre nettement plus vite.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "wgpu",
    "tokio",
    "winit",
    "single-instance",
    "about",
], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros"], optional = true }
open = { version = "5", optional = true }

# --- Installateur console (feature "tui") ------------------------------------
ratatui = { version = "0.29", optional = true }
